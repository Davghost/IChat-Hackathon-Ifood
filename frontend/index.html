<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>iFood Owner Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main id="app" class="app-shell" v-cloak>
            <aside class="sidebar">
                <a class="brand" href="index.html" aria-label="iFood Manager">
                    <span class="brand-mark">iF</span>
                    <span>
                        <strong>iFood</strong>
                        <small>Manager</small>
                    </span>
                </a>

                <nav class="nav-list" aria-label="Navegacao principal">
                    <button class="nav-item" type="button" :class="{ active: activeView === 'overview' }" @click="activeView = 'overview'">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Resumo</span>
                    </button>
                    <button class="nav-item" type="button" :class="{ active: activeView === 'orders' }" @click="activeView = 'orders'">
                        <i data-lucide="receipt-text"></i>
                        <span>Pedidos</span>
                    </button>
                    <button class="nav-item" type="button" :class="{ active: activeView === 'menu' }" @click="activeView = 'menu'">
                        <i data-lucide="utensils"></i>
                        <span>Cardapio</span>
                    </button>
                    <button class="nav-item" type="button" :class="{ active: activeView === 'restaurants' }" @click="activeView = 'restaurants'">
                        <i data-lucide="store"></i>
                        <span>Lojas</span>
                    </button>
                    <button class="nav-item" type="button" :class="{ active: activeView === 'revenue' }" @click="activeView = 'revenue'">
                        <i data-lucide="wallet-cards"></i>
                        <span>Faturamento</span>
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <p>{{ userEmail || 'Sessao nao iniciada' }}</p>
                    <button class="icon-button" type="button" @click="logout" title="Sair" aria-label="Sair">
                        <i data-lucide="log-out"></i>
                    </button>
                </div>
            </aside>

            <section class="workspace">
                <header class="topbar">
                    <div>
                        <p class="eyebrow">{{ formattedToday }}</p>
                        <h1>Painel do restaurante</h1>
                    </div>

                    <div class="topbar-actions">
                        <a class="button button-ghost" href="pages/login.html" v-if="!isLoggedIn">
                            <i data-lucide="log-in"></i>
                            Entrar
                        </a>
                        <button class="button button-primary" type="button" @click="openMenuCreate" v-else>
                            <i data-lucide="plus"></i>
                            Novo item
                        </button>
                    </div>
                </header>

                <p v-if="errorMessage" class="alert alert-error">{{ errorMessage }}</p>
                <p v-if="successMessage" class="alert alert-success">{{ successMessage }}</p>

                <section v-if="loading" class="loading-state">
                    <span class="loader"></span>
                    <p>Carregando painel...</p>
                </section>

                <section v-else-if="!isLoggedIn" class="empty-state">
                    <i data-lucide="lock-keyhole"></i>
                    <h2>Acesse sua conta de dono</h2>
                    <p>Use o login para carregar restaurantes, cardapio e indicadores.</p>
                    <a class="button button-primary" href="pages/login.html">Entrar agora</a>
                </section>

                <template v-else>
                    <section class="view-stack" v-show="activeView === 'overview'">
                        <div class="metric-grid">
                            <article class="metric-card metric-red">
                                <span>Pedidos hoje</span>
                                <strong>{{ dashboard.ordersToday }}</strong>
                                <small>{{ dashboard.pendingOrders }} em andamento</small>
                            </article>
                            <article class="metric-card metric-green">
                                <span>Faturamento</span>
                                <strong>{{ formatCurrency(dashboard.revenueToday) }}</strong>
                                <small>{{ formatCurrency(dashboard.averageTicket) }} ticket medio</small>
                            </article>
                            <article class="metric-card metric-orange">
                                <span>Itens ativos</span>
                                <strong>{{ menuItems.length }}</strong>
                                <small>{{ restaurants.length }} loja(s)</small>
                            </article>
                            <article class="metric-card metric-blue">
                                <span>Avaliacoes</span>
                                <strong>{{ dashboard.rating }}</strong>
                                <small>{{ dashboard.deliveryTime }} min entrega</small>
                            </article>
                        </div>

                        <div class="content-grid">
                            <section class="panel">
                                <div class="panel-header">
                                    <div>
                                        <p class="eyebrow">Tempo real</p>
                                        <h2>Pedidos do dia</h2>
                                    </div>
                                    <button class="button button-ghost" type="button" @click="activeView = 'orders'">
                                        Ver todos
                                    </button>
                                </div>
                                <div class="order-list compact">
                                    <article class="order-row" v-for="order in todayOrders.slice(0, 5)" :key="order.id">
                                        <div>
                                            <strong>#{{ order.id }} {{ order.customer }}</strong>
                                            <span>{{ order.itemName }} x{{ order.quantity }}</span>
                                        </div>
                                        <div class="order-meta">
                                            <span class="status-pill" :class="order.statusClass">{{ order.status }}</span>
                                            <strong>{{ formatCurrency(order.total) }}</strong>
                                        </div>
                                    </article>
                                </div>
                            </section>

                            <section class="panel">
                                <div class="panel-header">
                                    <div>
                                        <p class="eyebrow">Mais vendidos</p>
                                        <h2>Cardapio em destaque</h2>
                                    </div>
                                </div>
                                <div class="best-list">
                                    <article class="best-item" v-for="item in topMenuItems" :key="item.id">
                                        <span>{{ item.rank }}</span>
                                        <div>
                                            <strong>{{ item.name }}</strong>
                                            <small>{{ item.title }}</small>
                                        </div>
                                        <strong>{{ formatCurrency(item.price) }}</strong>
                                    </article>
                                </div>
                            </section>
                        </div>
                    </section>

                    <section class="view-stack" v-show="activeView === 'orders'">
                        <div class="section-heading">
                            <div>
                                <p class="eyebrow">Operacao</p>
                                <h2>Pedidos do dia</h2>
                            </div>
                        </div>

                        <div class="orders-board">
                            <article class="order-card" v-for="order in todayOrders" :key="order.id">
                                <div class="order-card-top">
                                    <strong>#{{ order.id }}</strong>
                                    <span class="status-pill" :class="order.statusClass">{{ order.status }}</span>
                                </div>
                                <h3>{{ order.customer }}</h3>
                                <p>{{ order.itemName }} x{{ order.quantity }}</p>
                                <div class="order-card-bottom">
                                    <span>{{ order.time }}</span>
                                    <strong>{{ formatCurrency(order.total) }}</strong>
                                </div>
                            </article>
                        </div>
                    </section>

                    <section class="view-stack" v-show="activeView === 'menu'">
                        <div class="section-heading">
                            <div>
                                <p class="eyebrow">Gestao</p>
                                <h2>Cardapio</h2>
                            </div>
                            <button class="button button-primary" type="button" @click="openMenuCreate">
                                <i data-lucide="plus"></i>
                                Novo item
                            </button>
                        </div>

                        <form class="editor-panel" @submit.prevent="saveMenuItem">
                            <div class="form-grid">
                                <label class="field">
                                    <span>Titulo</span>
                                    <input type="text" v-model.trim="menuForm.title" placeholder="Categoria ou chamada" required>
                                </label>
                                <label class="field">
                                    <span>Nome</span>
                                    <input type="text" v-model.trim="menuForm.name" placeholder="Nome do prato" required>
                                </label>
                                <label class="field">
                                    <span>Preco</span>
                                    <input type="number" min="0" step="0.01" v-model.number="menuForm.price" placeholder="0,00" required>
                                </label>
                                <label class="field">
                                    <span>Loja</span>
                                    <select v-model="menuForm.restaurant_id">
                                        <option :value="null">Sem loja vinculada</option>
                                        <option v-for="restaurant in restaurants" :key="restaurant.id" :value="restaurant.id">
                                            {{ restaurant.name }}
                                        </option>
                                    </select>
                                </label>
                                <label class="field field-wide">
                                    <span>Descricao</span>
                                    <textarea v-model.trim="menuForm.description" rows="3" placeholder="Ingredientes, tamanho e diferenciais" required></textarea>
                                </label>
                            </div>
                            <div class="form-actions">
                                <button class="button button-primary" type="submit" :disabled="saving">
                                    <i data-lucide="save"></i>
                                    {{ saving ? 'Salvando...' : menuForm.id ? 'Salvar item' : 'Criar item' }}
                                </button>
                                <button class="button button-ghost" type="button" @click="resetMenuForm">Limpar</button>
                            </div>
                        </form>

                        <div class="table-panel">
                            <div class="table-row table-head">
                                <span>Item</span>
                                <span>Loja</span>
                                <span>Preco</span>
                                <span></span>
                            </div>
                            <div class="table-row" v-for="item in menuItems" :key="item.id">
                                <div>
                                    <strong>{{ item.name }}</strong>
                                    <small>{{ item.description }}</small>
                                </div>
                                <span>{{ restaurantName(item.restaurant_id) }}</span>
                                <strong>{{ formatCurrency(item.price) }}</strong>
                                <div class="row-actions">
                                    <button class="icon-button" type="button" @click="editMenuItem(item)" title="Editar item" aria-label="Editar item">
                                        <i data-lucide="pencil"></i>
                                    </button>
                                    <button class="icon-button danger" type="button" @click="deleteMenuItem(item.id)" title="Excluir item" aria-label="Excluir item">
                                        <i data-lucide="trash-2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="view-stack" v-show="activeView === 'restaurants'">
                        <div class="section-heading">
                            <div>
                                <p class="eyebrow">Cadastro</p>
                                <h2>Lojas</h2>
                            </div>
                        </div>

                        <form class="editor-panel" @submit.prevent="saveRestaurant">
                            <div class="form-grid two-cols">
                                <label class="field">
                                    <span>Nome</span>
                                    <input type="text" v-model.trim="restaurantForm.name" placeholder="Nome da loja" required>
                                </label>
                                <label class="field">
                                    <span>Descricao</span>
                                    <input type="text" v-model.trim="restaurantForm.description" placeholder="Cozinha, bairro ou proposta" required>
                                </label>
                            </div>
                            <div class="form-actions">
                                <button class="button button-primary" type="submit" :disabled="saving">
                                    <i data-lucide="save"></i>
                                    {{ saving ? 'Salvando...' : restaurantForm.id ? 'Salvar loja' : 'Criar loja' }}
                                </button>
                                <button class="button button-ghost" type="button" @click="resetRestaurantForm">Limpar</button>
                            </div>
                        </form>

                        <div class="restaurant-grid">
                            <article class="restaurant-card" v-for="restaurant in restaurants" :key="restaurant.id">
                                <div>
                                    <span class="restaurant-avatar">{{ initials(restaurant.name) }}</span>
                                </div>
                                <div>
                                    <h3>{{ restaurant.name }}</h3>
                                    <p>{{ restaurant.description }}</p>
                                    <small>{{ restaurantItemCount(restaurant.id) }} item(ns) no cardapio</small>
                                </div>
                                <div class="row-actions">
                                    <button class="icon-button" type="button" @click="editRestaurant(restaurant)" title="Editar loja" aria-label="Editar loja">
                                        <i data-lucide="pencil"></i>
                                    </button>
                                    <button class="icon-button danger" type="button" @click="deleteRestaurant(restaurant.id)" title="Excluir loja" aria-label="Excluir loja">
                                        <i data-lucide="trash-2"></i>
                                    </button>
                                </div>
                            </article>
                        </div>
                    </section>

                    <section class="view-stack" v-show="activeView === 'revenue'">
                        <div class="section-heading">
                            <div>
                                <p class="eyebrow">Financeiro</p>
                                <h2>Faturamento</h2>
                            </div>
                        </div>

                        <div class="revenue-layout">
                            <section class="panel revenue-panel">
                                <span>Hoje</span>
                                <strong>{{ formatCurrency(dashboard.revenueToday) }}</strong>
                                <div class="revenue-bars">
                                    <span v-for="bar in revenueBars" :key="bar.label" :style="{ height: bar.height + '%' }">
                                        <small>{{ bar.label }}</small>
                                    </span>
                                </div>
                            </section>

                            <section class="panel">
                                <div class="panel-header">
                                    <div>
                                        <p class="eyebrow">Resumo</p>
                                        <h2>Indicadores</h2>
                                    </div>
                                </div>
                                <div class="finance-list">
                                    <p><span>Ticket medio</span><strong>{{ formatCurrency(dashboard.averageTicket) }}</strong></p>
                                    <p><span>Itens vendidos</span><strong>{{ dashboard.itemsSold }}</strong></p>
                                    <p><span>Pedidos entregues</span><strong>{{ dashboard.deliveredOrders }}</strong></p>
                                    <p><span>Pedidos pendentes</span><strong>{{ dashboard.pendingOrders }}</strong></p>
                                </div>
                            </section>
                        </div>
                    </section>
                </template>
            </section>
        </main>

        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/index.js"></script>
    </body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardapio Owner</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="app-shell" v-cloak>
      <aside class="sidebar">
        <a class="brand" href="homeowner.html" aria-label="iFood Owner">
          <img src="../img/logo-smile-512x512.png" alt="logo-ifood" class="logo">
          <span>
            <strong>Painel de controle</strong>
          </span>
        </a>

        <nav class="nav-list">
          <a class="nav-item" href="homeowner.html">Resumo</a>
          <a class="nav-item" href="pedidos.html">Pedidos</a>
          <a class="nav-item active" href="cardapio.html">Cardapio</a>
          
          <a class="nav-item" href="faturamento.html">Faturamento</a>
        </nav>

        <div class="sidebar-footer">
          <p id="sidebarUserBadge">Sessão nao iniciada</p>
          <button id="logoutButton" class="button button-ghost small-button" type="button">Sair</button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="page-kicker">Gestao de menu</p>
            <h1 class="page-title">Cadastro de itens</h1>
          </div>
        </header>

        <section id="pageAccessState" class="guest-state" hidden></section>

        <section id="menuPageContent" class="view-stack" hidden>
          <p id="pageAlert" class="alert alert-success">Carregando...</p>

          <form id="menuForm" class="editor-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Formulario</p>
                <h2 id="menuFormTitle">Novo item</h2>
              </div>
            </div>

            <div class="form-grid two-cols">
              <label class="field">
                <span>Nome</span>
                <input id="menuName" type="text" required />
              </label>
              <label class="field">
                <span>Preco</span>
                <input id="menuPrice" type="number" min="0" step="0.01" required />
              </label>
            </div>

            <div class="form-actions">
              <button id="menuCancelButton" class="button button-ghost" type="button">Limpar</button>
              <button id="menuSaveButton" class="button button-primary" type="submit">Criar item</button>
            </div>
          </form>

          <section class="table-panel">
            <div class="table-row table-head">
              <span>Item</span>
              <span>Cadastrado em</span>
              <span>Preco</span>
              <span>Acoes</span>
            </div>
            <div id="menuTableBody"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app-utils.js"></script>
    <script src="../js/owner-menu.js"></script>
    <script src="../js/guard.js"></script>
  </body>
</html>

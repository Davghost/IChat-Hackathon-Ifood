<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faturamento</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="app-shell" v-cloak>
      <aside class="sidebar">
        <a class="brand" href="homeowner.html" aria-label="iFood Owner">
          <img src="../img/logo-smile-512x512.png" alt="logo-ifood" class="logo">
          <span>
            <strong>Painel de controle</strong>
          </span>
        </a>

        <nav class="nav-list">
          <a class="nav-item" href="homeowner.html">Resumo</a>
          <a class="nav-item" href="pedidos.html">Pedidos</a>
          <a class="nav-item" href="cardapio.html">Cardapio</a>
         
          <a class="nav-item active" href="faturamento.html">Faturamento</a>
        </nav>

        <div class="sidebar-footer">
          <p id="sidebarUserBadge">Sessao nao iniciada</p>
          <button id="logoutButton" class="button button-ghost small-button" type="button">Sair</button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="page-kicker">Analise financeira</p>
            <h1 class="page-title">Financeiro e previsoes</h1>
          </div>
        </header>

        <section id="analyticsPageContent" class="view-stack" hidden>
          <div class="revenue-layout">
            <section class="panel revenue-panel">
              <span>Receita acumulada</span>
              <strong id="revenueValue">R$ 0,00</strong>
              
              <div id="revenueBars"></div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">Resumo</p>
                  <h2>Indicadores</h2>
                </div>
              </div>
              <div id="financeList" class="finance-list"></div>
            </section>
          </div>

          <div class="content-grid">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">Forecast</p>
                  <h2>Proximos dias</h2>
                </div>
              </div>
              <div id="forecastList" class="forecast-list"></div>
            </section>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app-utils.js"></script>
    <script src="../js/owner-analytics.js"></script>
    <script src="../js/guard.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main id="app" class="login-shell" v-cloak>
      <section class="login-hero">
        <a class="brand" href="homeclient.html" aria-label="iFood Manager">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTY4R3cNywEEb-Mdn3Jipkc4Ex0T30tPDX3ONaiJyYm9Q&s=10" alt="logo-ifood" class="logo">
          
          <span>
            <strong>Painel de controle</strong>
          </span>
        </a>
        <div class="login-copy">
          <p class="eyebrow">Autenticação</p>
          <h1>Entre e siga para a area correta do seu perfil.</h1>
        </div>
      </section>

      <section class="login-card">
        <div class="login-card-header">
          <p class="eyebrow">Sessão</p>
          <h2>Login</h2>
        </div>

        <form class="form-stack" @submit.prevent="login">
          <label class="field">
            <span>Email</span>
            <input type="text" placeholder="seu@email.com" v-model="email" autocomplete="username" />
          </label>

          <label class="field">
            <span>Senha</span>
            <input type="password" placeholder="Digite sua senha" v-model="password" autocomplete="current-password" />
          </label>

          <button type="submit" class="button button-primary" :disabled="loginLoading">
            {{ loginLoading ? 'Entrando...' : 'Entrar' }}
          </button>
        </form>

        <p v-if="errorMessage" class="alert alert-error">{{ errorMessage }}</p>
        <p v-if="tokenReceived" class="alert alert-success">Login realizado.</p>

        <a class="login-back" href="homeclient.html">Voltar para a vitrine</a>
      </section>
    </main>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    
    <script src="../js/app-utils.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>

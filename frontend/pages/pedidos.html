<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos Owner</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="app-shell" v-cloak>
      <aside class="sidebar">
        <a class="brand" href="homeowner.html" aria-label="iFood Owner">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTY4R3cNywEEb-Mdn3Jipkc4Ex0T30tPDX3ONaiJyYm9Q&s=10" alt="logo-ifood" class="logo">
          
          <span>
            <strong>Painel de controle</strong>
          </span>
        </a>

        <nav class="nav-list">
          <a class="nav-item" href="homeowner.html">Resumo</a>
          <a class="nav-item active" href="pedidos.html">Pedidos</a>
          <a class="nav-item" href="cardapio.html">Cardapio</a>
         
          <a class="nav-item" href="faturamento.html">Faturamento</a>
        </nav>

        <div class="sidebar-footer">
          <p id="sidebarUserBadge">Sessao nao iniciada</p>
          <button id="logoutButton" class="button button-ghost small-button" type="button">Sair</button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="page-kicker">Operações de pedidos</p>
            <h1 class="page-title">Fila do restaurante</h1>
          </div>
        </header>
          <section class="editor-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Filtros</p>
                <h2>Refinar lista</h2>
              </div>
            </div>

            <div class="form-grid two-cols">
              <label class="field">
                <span>Status</span>
                <select id="statusFilter">
                  <option value="">Todos</option>
                  <option value="new">Novo</option>
                  <option value="preparing">Em preparo</option>
                  <option value="ready">Pronto</option>
                  <option value="delivered">Entregue</option>
                  <option value="cancelled">Cancelado</option>
                </select>
              </label>
            </div>

            <div class="form-actions">
              <button id="applyFiltersButton" class="button button-primary" type="button">Aplicar filtros</button>
            </div>
          </section>
<br>
          <div id="ordersStatusMetrics" class="metric-grid"></div>
          <br>
          <section id="ordersBoard" class="orders-board"></section>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app-utils.js"></script>
    <script src="../js/owner-orders.js"></script>
    <script src="../js/guard.js"></script>
  </body>
</html>
